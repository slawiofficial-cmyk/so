    <script>
      // Safeguard for iframe environments where window.fetch is a getter-only property
      try {
        if (typeof window !== 'undefined' && window.fetch) {
          const nativeFetch = window.fetch.bind(window);
          Object.defineProperty(window, 'fetch', {
            value: nativeFetch,
            writable: true,
            configurable: true,
          });
        }
      } catch (e) {}
    </script>
